[project]
name = "job-application-tracker"
version = "0.1.0"
description = "Track job applications: companies, jobs, application status and interview rounds, with a FastAPI API and a Jinja2 + JavaScript frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "pillow>=13.0.0",
    "aiosmtplib>=5.1.3",
    "slowapi>=0.1.10",
    "jinja2>=3.1.6",
    "boto3>=1.43.123",
    "sentry-sdk[fastapi]>=2.68.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"alembic/env.py" = ["F401"]
