[project]
name = "job-application-tracker"
version = "0.1.0"
description = "Track job applications: companies, jobs, application status and interview rounds, with a FastAPI API and a Jinja2 + JavaScript frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "pillow>=13.0.0",
    "aiosmtplib>=5.1.3",
    "slowapi>=0.1.10",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Migrations are generated by Alembic; leave their style alone.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: style errors and warnings (e.g. bad indentation), F: real mistakes (e.g. unused imports,
# undefined names), I: import order.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
# This project leaves two blank lines after the imports.
lines-after-imports = 2
# The alembic/ folder holds migrations; "alembic" imports mean the installed package.
known-third-party = ["alembic"]
