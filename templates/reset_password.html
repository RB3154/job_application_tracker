{% extends "layout.html" %}
{% block content %}
    <div class="content-section auth-card">
        <h1 class="h3 mb-1">Set a new password</h1>
        <p class="text-muted-soft mb-4">Choose a new password for your account.</p>
        <div class="alert alert-danger form-error d-none" role="alert"></div>
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label">New password</label>
                <input type="password" class="form-control" id="newPassword" required minlength="8" maxlength="128" autocomplete="new-password" autofocus>
                <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm new password</label>
                <input type="password" class="form-control" id="confirmPassword" required minlength="8" autocomplete="new-password">
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset password</button>
        </form>
        <p class="text-center text-muted-soft mt-4 mb-0">
            Link expired? <a href="{{ url_for('forgot_password_page') }}">Request a new one</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
        import { apiFetch } from "/static/js/api.js";
        import { queueToast, setButtonLoading } from "/static/js/utils.js";

        const form = document.getElementById("resetPasswordForm");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmInput = document.getElementById("confirmPassword");
        const formError = document.querySelector(".form-error");
        const submitButton = form.querySelector("[type=submit]");

        function showError(message) {
          formError.textContent = message;
          formError.classList.remove("d-none");
        }

        // The emailed link looks like /reset-password?token=...
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) {
          showError("This reset link is missing its token. Request a new password reset.");
          submitButton.disabled = true;
        }

        function checkPasswordsMatch() {
          const matches = newPasswordInput.value === confirmInput.value;
          confirmInput.setCustomValidity(matches ? "" : "Passwords do not match");
          confirmInput.classList.toggle("is-invalid", !matches && confirmInput.value !== "");
          return matches;
        }
        newPasswordInput.addEventListener("input", checkPasswordsMatch);
        confirmInput.addEventListener("input", checkPasswordsMatch);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!token || !checkPasswordsMatch()) {
            return;
          }
          formError.classList.add("d-none");
          setButtonLoading(submitButton, true, "Resetting...");

          try {
            const data = await apiFetch("/api/users/reset-password", {
              method: "POST",
              body: { token, new_password: newPasswordInput.value },
            });
            queueToast(data.message);
            window.location.href = "/login";
          } catch (error) {
            showError(error.message);
            setButtonLoading(submitButton, false);
          }
        });
    </script>
{% endblock scripts %}
