{% extends "layout.html" %}
{% block content %}
    <section class="content-section empty-state mx-auto my-4" style="max-width: 36rem">
        <div class="display-4 fw-bold text-primary mb-2">{{ status_code }}</div>
        <h1 class="h4">
            {% if status_code == 404 %}We couldn't find that page{% else %}Something went wrong{% endif %}
        </h1>
        <p class="mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-primary" href="{{ url_for('home') }}">Go to dashboard</a>
            <a class="btn btn-outline-primary" href="{{ url_for('jobs_page') }}">Browse jobs</a>
        </div>
    </section>
{% endblock content %}
