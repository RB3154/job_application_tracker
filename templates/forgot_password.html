{% extends "layout.html" %}
{% block content %}
    <div class="content-section auth-card">
        <h1 class="h3 mb-1">Forgot your password?</h1>
        <p class="text-muted-soft mb-4">Enter your email and we'll send you a link to set a new one.</p>
        <div class="alert alert-danger form-error d-none" role="alert"></div>
        <div class="alert alert-success d-none" id="successMessage" role="status"></div>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email" autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>
        <p class="text-center text-muted-soft mt-4 mb-0">
            Remembered it? <a href="{{ url_for('login_page') }}">Log in</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
        import { apiFetch } from "/static/js/api.js";
        import { setButtonLoading } from "/static/js/utils.js";

        const form = document.getElementById("forgotPasswordForm");
        const formError = document.querySelector(".form-error");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const submitButton = form.querySelector("[type=submit]");
          formError.classList.add("d-none");
          setButtonLoading(submitButton, true, "Sending...");

          try {
            // The API gives the same answer whether or not the email has an account (so nobody can probe for accounts).
            const data = await apiFetch("/api/users/forgot-password", {
              method: "POST",
              body: { email: form.email.value.trim() },
            });
            successMessage.textContent = data.message;
            successMessage.classList.remove("d-none");
            form.reset();
          } catch (error) {
            formError.textContent = error.message;
            formError.classList.remove("d-none");
          } finally {
            setButtonLoading(submitButton, false);
          }
        });
    </script>
{% endblock scripts %}
